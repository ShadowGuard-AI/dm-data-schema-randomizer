<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Animated scene: moon gates in the far band, a peg wall of woven cloaks crossed by carried lantern light in the middle band, and the broom badge swaying a finger's width on its peg in the near band, acorns resting by the door">
<defs>
<radialGradient id="lamp" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#f2c063" stop-opacity="0.85"/>
<stop offset="100%" stop-color="#f2c063" stop-opacity="0"/>
</radialGradient>
</defs>
<!-- Far band: moon gates stand where they were built; one hinged leaf swings in the draught -->
<rect x="0" y="0" width="1200" height="120" fill="#5a6068"/>
<line x1="0" y1="118" x2="1200" y2="118" stroke="#9aa5ae" stroke-width="3"/>
<circle cx="300" cy="62" r="46" fill="#a8b29e"/>
<circle cx="300" cy="62" r="46" fill="none" stroke="#4a3e30" stroke-width="10"/>
<circle cx="300" cy="62" r="38" fill="none" stroke="#9aa5ae" stroke-width="3"/>
<g>
<path d="M 300 16 A 46 46 0 0 1 300 108 Z" fill="#7a8f6a" opacity="0.9"/>
<animateTransform attributeName="transform" type="rotate" values="-10 300 62; 12 300 62; -10 300 62" dur="7s" repeatCount="indefinite"/>
</g>
<circle cx="880" cy="62" r="46" fill="#a8b29e"/>
<circle cx="880" cy="62" r="46" fill="none" stroke="#4a3e30" stroke-width="10"/>
<circle cx="880" cy="62" r="38" fill="none" stroke="#9aa5ae" stroke-width="3"/>
<circle cx="252" cy="30" r="3" fill="#d6902a"/><circle cx="348" cy="94" r="3" fill="#d6902a"/>
<circle cx="832" cy="94" r="3" fill="#d6902a"/><circle cx="928" cy="30" r="3" fill="#d6902a"/>
<!-- Middle band: woven cloaks hang still while carried lantern light travels across them -->
<rect x="0" y="120" width="1200" height="120" fill="#4e545b"/>
<line x1="0" y1="140" x2="1200" y2="140" stroke="#2c2a26" stroke-width="6"/>
<g fill="#5f7355">
<polygon points="120,146 190,146 178,232 132,232"/><polygon points="330,146 400,146 388,232 342,232"/>
<polygon points="540,146 610,146 598,232 552,232"/><polygon points="750,146 820,146 808,232 762,232"/>
<polygon points="960,146 1030,146 1018,232 972,232"/>
</g>
<g stroke="#465c3e" stroke-width="3">
<line x1="126" y1="176" x2="184" y2="176"/><line x1="128" y1="204" x2="182" y2="204"/>
<line x1="336" y1="176" x2="394" y2="176"/><line x1="338" y1="204" x2="392" y2="204"/>
<line x1="546" y1="176" x2="604" y2="176"/><line x1="548" y1="204" x2="602" y2="204"/>
<line x1="756" y1="176" x2="814" y2="176"/><line x1="758" y1="204" x2="812" y2="204"/>
<line x1="966" y1="176" x2="1024" y2="176"/><line x1="968" y1="204" x2="1022" y2="204"/>
</g>
<ellipse cx="100" cy="182" rx="150" ry="58" fill="url(#lamp)">
<animate attributeName="cx" values="100; 1100; 100" dur="11s" repeatCount="indefinite"/>
</ellipse>
<!-- Near band: the badge sways a finger's width on its peg and settles; acorns rest where they fell -->
<rect x="0" y="240" width="1200" height="120" fill="#464c52"/>
<line x1="0" y1="240" x2="1200" y2="240" stroke="#9aa5ae" stroke-width="3"/>
<g>
<line x1="600" y1="246" x2="600" y2="262" stroke="#2c2a26" stroke-width="7"/>
<circle cx="600" cy="252" r="7" fill="#342e26"/>
<g>
<circle cx="600" cy="306" r="46" fill="#5f7355"/>
<circle cx="600" cy="306" r="36" fill="#80888f"/>
<circle cx="600" cy="306" r="29" fill="none" stroke="#c7cdd3" stroke-width="3"/>
<line x1="614" y1="282" x2="588" y2="318" stroke="#e8a33d" stroke-width="8"/>
<line x1="588" y1="318" x2="578" y2="334" stroke="#e8a33d" stroke-width="4"/>
<line x1="588" y1="318" x2="588" y2="336" stroke="#e8a33d" stroke-width="4"/>
<line x1="588" y1="318" x2="598" y2="334" stroke="#e8a33d" stroke-width="4"/>
<animateTransform attributeName="transform" type="rotate" values="-2 600 252; 2 600 252; 0 600 252; -2 600 252" dur="6s" repeatCount="indefinite"/>
</g>
</g>
<g fill="#926636">
<ellipse cx="140" cy="338" rx="10" ry="8"/><ellipse cx="180" cy="346" rx="8" ry="6"/>
<ellipse cx="1040" cy="342" rx="10" ry="8"/><ellipse cx="1082" cy="350" rx="8" ry="6"/>
</g>
<g fill="#684828">
<path d="M 130 334 a 10 6 0 0 1 20 0 Z"/><path d="M 1030 338 a 10 6 0 0 1 20 0 Z"/>
</g>
</svg>
